[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nonebot-plugin-set-title"
version = "0.1.0"
description = "NoneBot2 群头衔管理插件，支持单用户/批量设置QQ群专属头衔（Alconna优化版）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your@email.com" },
]
keywords = ["nonebot", "nonebot2", "plugin", "qq", "group", "title", "set-title", "alconna"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.0.0",
    "nonebot-adapter-onebot>=2.0.0",
    "nonebot-plugin-alconna>=0.50.0",
]

[project.urls]
Homepage = "https://github.com/your-name/nonebot-plugin-set-title"
Repository = "https://github.com/your-name/nonebot-plugin-set-title"
Issues = "https://github.com/your-name/nonebot-plugin-set-title/issues"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_set_title"]

[tool.nonebot]
plugins = ["nonebot_plugin_set_title"]
